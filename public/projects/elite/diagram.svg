<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F4E5F"/></marker>
    <marker id="arrowClay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2603F"/></marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="1000" fill="#F3EFE9"/>
  <circle cx="120" cy="80" r="380" fill="#CFE0E3" filter="url(#blur)"/>
  <circle cx="1500" cy="960" r="360" fill="#F0D2C3" filter="url(#blur)"/>

  <!-- title -->
  <text x="80" y="92" font-size="34" font-weight="800" fill="#16303A">Elite: employee benefits web app</text>
  <text x="80" y="128" font-size="19" fill="#1F4E5F">Frontend architecture (React SPA) and the services it talks to.</text>

  <!-- ===== Users ===== -->
  <g>
    <rect x="80" y="200" width="250" height="300" rx="22" fill="#fff" stroke="#B9D2DA" stroke-width="2"/>
    <text x="205" y="244" font-size="21" font-weight="800" fill="#16303A" text-anchor="middle">Employees</text>
    <text x="205" y="272" font-size="15" fill="#1F4E5F" text-anchor="middle">of each client company</text>
    <rect x="110" y="300" width="190" height="52" rx="12" fill="#CFE0E3"/>
    <text x="205" y="332" font-size="16" font-weight="700" fill="#16303A" text-anchor="middle">Desktop browser</text>
    <rect x="110" y="366" width="190" height="52" rx="12" fill="#CFE0E3"/>
    <text x="205" y="398" font-size="16" font-weight="700" fill="#16303A" text-anchor="middle">Phone browser</text>
    <text x="205" y="452" font-size="14" fill="#1F4E5F" text-anchor="middle">Arabic UI, right-to-left</text>
    <text x="205" y="474" font-size="14" fill="#1F4E5F" text-anchor="middle">OTP login: mobile or email</text>
  </g>

  <!-- ===== SPA ===== -->
  <g>
    <rect x="400" y="180" width="760" height="720" rx="26" fill="#fff" stroke="#1F4E5F" stroke-width="2.5"/>
    <rect x="400" y="180" width="760" height="64" rx="26" fill="#1F4E5F"/>
    <rect x="400" y="220" width="760" height="24" fill="#1F4E5F"/>
    <text x="430" y="222" font-size="22" font-weight="800" fill="#fff">React 18 SPA · Vite · Redux Toolkit</text>
    <text x="1130" y="222" font-size="15" fill="#CFE0E3" text-anchor="end">React-Bootstrap · CSS modules</text>

    <!-- white-label -->
    <rect x="430" y="270" width="700" height="96" rx="16" fill="#F0D2C3"/>
    <text x="452" y="302" font-size="18" font-weight="800" fill="#16303A">White-label per client</text>
    <text x="452" y="328" font-size="15" fill="#16303A">client_id in the login link → client logo (also favicon and app icon),</text>
    <text x="452" y="350" font-size="15" fill="#16303A">brand colours as CSS variables, app id for analytics. Re-applied from the user's client.</text>

    <!-- feature modules -->
    <text x="430" y="402" font-size="15" font-weight="800" fill="#1F4E5F" letter-spacing="1">FEATURE MODULES (ROUTES)</text>
    <g font-size="15" fill="#16303A">
      <rect x="430" y="416" width="222" height="88" rx="14" fill="#CFE0E3"/>
      <text x="446" y="446" font-weight="800">Offers</text>
      <text x="446" y="470">sectors, cities, favourites,</text>
      <text x="446" y="490">provider profiles, stories</text>

      <rect x="669" y="416" width="222" height="88" rx="14" fill="#CFE0E3"/>
      <text x="685" y="446" font-weight="800">Map</text>
      <text x="685" y="470">radius search, zoom</text>
      <text x="685" y="490">fitted to radius, filters</text>

      <rect x="908" y="416" width="222" height="88" rx="14" fill="#CFE0E3"/>
      <text x="924" y="446" font-weight="800">Chat</text>
      <text x="924" y="470">voice notes, location, reply,</text>
      <text x="924" y="490">forward, pin, archive, search</text>

      <rect x="430" y="518" width="222" height="88" rx="14" fill="#CFE0E3"/>
      <text x="446" y="548" font-weight="800">Events engine</text>
      <text x="446" y="572">marathon, vote, streak,</text>
      <text x="446" y="592">tournaments, survey</text>

      <rect x="669" y="518" width="222" height="88" rx="14" fill="#CFE0E3"/>
      <text x="685" y="548" font-weight="800">Points &amp; gifts</text>
      <text x="685" y="572">send points to colleagues,</text>
      <text x="685" y="592">reserve gifts, history</text>

      <rect x="908" y="518" width="222" height="88" rx="14" fill="#CFE0E3"/>
      <text x="924" y="548" font-weight="800">QR redemption</text>
      <text x="924" y="572">scan shop QR → offer</text>
      <text x="924" y="592">→ upload invoice photo</text>
    </g>

    <!-- state -->
    <rect x="430" y="630" width="340" height="110" rx="16" fill="#F3EFE9" stroke="#B9D2DA" stroke-width="2"/>
    <text x="450" y="662" font-size="18" font-weight="800" fill="#16303A">Redux Toolkit</text>
    <text x="450" y="688" font-size="15" fill="#16303A">13 slices, one async thunk per endpoint</text>
    <text x="450" y="710" font-size="15" fill="#16303A">redux-persist: session, client brand,</text>
    <text x="450" y="730" font-size="15" fill="#16303A">promo timers</text>

    <!-- api client -->
    <rect x="790" y="630" width="340" height="110" rx="16" fill="#F3EFE9" stroke="#B9D2DA" stroke-width="2"/>
    <text x="810" y="662" font-size="18" font-weight="800" fill="#16303A">axios API client</text>
    <text x="810" y="688" font-size="15" fill="#16303A">maintenance mode: one switch stops</text>
    <text x="810" y="710" font-size="15" fill="#16303A">every request with one message</text>
    <text x="810" y="730" font-size="15" fill="#16303A">401 → session cleared, back to login</text>

    <!-- presence -->
    <rect x="430" y="760" width="700" height="112" rx="16" fill="#F3EFE9" stroke="#B9D2DA" stroke-width="2"/>
    <text x="450" y="792" font-size="18" font-weight="800" fill="#16303A">Real-time layer</text>
    <text x="450" y="818" font-size="15" fill="#16303A">Push: FCM service worker + foreground handler that drops new chat messages into the store.</text>
    <text x="450" y="840" font-size="15" fill="#16303A">Presence: ONLINE / OFFLINE heartbeat on tab visibility and network changes.</text>
    <text x="450" y="862" font-size="15" fill="#16303A">Countdowns: shared useCountdown hook for every timed event.</text>
  </g>

  <!-- ===== External services ===== -->
  <g>
    <rect x="1230" y="200" width="290" height="190" rx="22" fill="#16303A"/>
    <text x="1375" y="246" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">REST API</text>
    <text x="1375" y="274" font-size="15" fill="#CFE0E3" text-anchor="middle">/api/v1 · company backend</text>
    <text x="1375" y="312" font-size="15" fill="#fff" text-anchor="middle">offers · providers · chat</text>
    <text x="1375" y="336" font-size="15" fill="#fff" text-anchor="middle">events · points · gifts</text>
    <text x="1375" y="360" font-size="15" fill="#fff" text-anchor="middle">invoices · users · lookups</text>

    <rect x="1230" y="430" width="290" height="130" rx="22" fill="#fff" stroke="#C2603F" stroke-width="2"/>
    <text x="1375" y="474" font-size="20" font-weight="800" fill="#16303A" text-anchor="middle">Firebase</text>
    <text x="1375" y="502" font-size="15" fill="#1F4E5F" text-anchor="middle">Cloud Messaging (push)</text>
    <text x="1375" y="526" font-size="15" fill="#1F4E5F" text-anchor="middle">Analytics (per client app id)</text>

    <rect x="1230" y="600" width="290" height="120" rx="22" fill="#fff" stroke="#B9D2DA" stroke-width="2"/>
    <text x="1375" y="644" font-size="20" font-weight="800" fill="#16303A" text-anchor="middle">Google Maps JS</text>
    <text x="1375" y="672" font-size="15" fill="#1F4E5F" text-anchor="middle">maps, markers, radius</text>
    <text x="1375" y="696" font-size="15" fill="#1F4E5F" text-anchor="middle">Places, Geocoder</text>

    <rect x="1230" y="760" width="290" height="112" rx="22" fill="#fff" stroke="#B9D2DA" stroke-width="2"/>
    <text x="1375" y="804" font-size="20" font-weight="800" fill="#16303A" text-anchor="middle">Static hosting</text>
    <text x="1375" y="832" font-size="15" fill="#1F4E5F" text-anchor="middle">Vite build on Apache</text>
    <text x="1375" y="854" font-size="15" fill="#1F4E5F" text-anchor="middle">SPA rewrite (.htaccess)</text>
  </g>

  <!-- ===== arrows ===== -->
  <g fill="none" stroke-width="2.5">
    <path d="M332 350 L396 350" stroke="#1F4E5F" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M1164 295 L1226 295" stroke="#1F4E5F" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M1226 495 L1164 495" stroke="#C2603F" stroke-dasharray="7 6" marker-end="url(#arrowClay)"/>
    <path d="M1164 660 L1226 660" stroke="#C2603F" stroke-dasharray="7 6" marker-end="url(#arrowClay)"/>
    <path d="M1226 816 L1164 816" stroke="#1F4E5F" marker-end="url(#arrow)"/>
  </g>

  <!-- legend -->
  <g font-size="14" fill="#1F4E5F">
    <line x1="80" y1="944" x2="120" y2="944" stroke="#1F4E5F" stroke-width="2.5"/>
    <text x="130" y="949">request / response</text>
    <line x1="300" y1="944" x2="340" y2="944" stroke="#C2603F" stroke-width="2.5" stroke-dasharray="7 6"/>
    <text x="350" y="949">push / third-party service</text>
  </g>
</svg>
