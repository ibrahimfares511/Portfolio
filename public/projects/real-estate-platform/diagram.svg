<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Nunito, 'Alexandria', system-ui, sans-serif">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F4E5F"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#16303A}
      .s{font-size:12.5px;fill:#5D6B70}
      .l{font-size:11px;font-weight:700;letter-spacing:.06em;fill:#1F4E5F}
      .chip{fill:#FFFFFF;stroke:#E2DDD4}
      .ct{font-size:12px;font-weight:600;fill:#16303A}
      .flow{stroke:#1F4E5F;stroke-width:1.6;fill:none}
      .ft{font-size:11.5px;fill:#1F4E5F;font-weight:600}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#F3EFE9"/>
  <ellipse cx="120" cy="60" rx="380" ry="260" fill="#CFE0E3" filter="url(#blur)"/>
  <ellipse cx="1110" cy="730" rx="380" ry="240" fill="#F0D2C3" filter="url(#blur)"/>

  <text x="40" y="52" font-size="24" font-weight="800" fill="#16303A">Real estate platform · architecture</text>
  <circle cx="441" cy="47" r="4" fill="#C2603F"/>
  <text x="40" y="76" class="s">Bilingual (Arabic / English) marketplace: listing → review → offer → contract → payment</text>

  <!-- Column 1: users -->
  <text x="40" y="126" class="l">WHO USES IT</text>
  <g>
    <rect x="40" y="140" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#E2DDD4"/>
    <text x="56" y="166" class="t">Guest</text><text x="56" y="187" class="s">Browse &amp; search</text>
    <rect x="40" y="216" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#E2DDD4"/>
    <text x="56" y="242" class="t">User</text><text x="56" y="263" class="s">List · offer · sign · pay</text>
    <rect x="40" y="292" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#E2DDD4"/>
    <text x="56" y="318" class="t">Employee</text><text x="56" y="339" class="s">Assigned properties</text>
    <rect x="40" y="368" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#E2DDD4"/>
    <text x="56" y="394" class="t">Admin</text><text x="56" y="415" class="s">Moderation · reports</text>
  </g>

  <!-- Column 2: frontend (Ibrahim) -->
  <rect x="260" y="104" width="430" height="560" rx="24" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2"/>
  <rect x="276" y="118" width="148" height="24" rx="12" fill="#16303A"/>
  <text x="290" y="135" font-size="11.5" font-weight="700" fill="#F3EFE9">FRONTEND · IBRAHIM</text>
  <text x="284" y="172" class="t" font-size="18">Next.js 16 · React 19 · TypeScript</text>
  <text x="284" y="194" class="s">App Router · standalone build on Node (cPanel)</text>

  <rect x="284" y="212" width="382" height="76" rx="14" fill="#CFE0E3" opacity=".55"/>
  <text x="300" y="236" class="t">Edge proxy</text>
  <text x="300" y="256" class="s">Locale routing /ar (RTL, default) · /en (LTR)</text>
  <text x="300" y="275" class="s">Role guard from token + role cookies before render</text>

  <text x="284" y="316" class="l">ROUTE GROUPS · ONE APP, FOUR EXPERIENCES</text>
  <rect x="284" y="326" width="88" height="30" rx="8" class="chip"/><text x="300" y="346" class="ct">(public)</text>
  <rect x="380" y="326" width="80" height="30" rx="8" class="chip"/><text x="398" y="346" class="ct">(user)</text>
  <rect x="468" y="326" width="104" height="30" rx="8" class="chip"/><text x="484" y="346" class="ct">(employee)</text>
  <rect x="580" y="326" width="86" height="30" rx="8" class="chip"/><text x="597" y="346" class="ct">(admin)</text>
  <text x="284" y="378" class="s">Shared dashboard views reused across roles via a variant prop</text>

  <text x="284" y="410" class="l">DOMAIN MODULES · api → hooks → components</text>
  <g>
    <rect x="284" y="420" width="90" height="28" rx="8" class="chip"/><text x="298" y="439" class="ct">property</text>
    <rect x="380" y="420" width="96" height="28" rx="8" class="chip"/><text x="392" y="439" class="ct">interaction</text>
    <rect x="482" y="420" width="62" height="28" rx="8" class="chip"/><text x="496" y="439" class="ct">offer</text>
    <rect x="550" y="420" width="78" height="28" rx="8" class="chip"/><text x="562" y="439" class="ct">contract</text>
    <rect x="284" y="454" width="84" height="28" rx="8" class="chip"/><text x="297" y="473" class="ct">payment</text>
    <rect x="374" y="454" width="70" height="28" rx="8" class="chip"/><text x="388" y="473" class="ct">report</text>
    <rect x="450" y="454" width="104" height="28" rx="8" class="chip"/><text x="463" y="473" class="ct">notification</text>
    <rect x="560" y="454" width="68" height="28" rx="8" class="chip"/><text x="573" y="473" class="ct">slider</text>
  </g>

  <rect x="284" y="500" width="186" height="140" rx="14" fill="#F3EFE9"/>
  <text x="298" y="524" class="t">Server components</text>
  <text x="298" y="545" class="s">safeServerFetch: a failing</text>
  <text x="298" y="563" class="s">endpoint hides a section,</text>
  <text x="298" y="581" class="s">the page stays up</text>
  <text x="298" y="610" class="s">next-intl messages ar / en</text>

  <rect x="480" y="500" width="186" height="140" rx="14" fill="#F3EFE9"/>
  <text x="494" y="524" class="t">Client state</text>
  <text x="494" y="545" class="s">TanStack Query + Axios</text>
  <text x="494" y="563" class="s">Bearer token + X-Locale</text>
  <text x="494" y="581" class="s">React Hook Form + Zod</text>
  <text x="494" y="599" class="s">Leaflet map picker</text>
  <text x="494" y="617" class="s">html2pdf receipts</text>

  <!-- Column 3: API -->
  <rect x="760" y="104" width="230" height="420" rx="24" fill="#FFFFFF" stroke="#E2DDD4"/>
  <text x="780" y="136" class="l">BACKEND · SEPARATE DEV</text>
  <text x="780" y="166" class="t" font-size="18">Laravel 13 API</text>
  <text x="780" y="188" class="s">Modular (9 modules)</text>
  <rect x="780" y="206" width="190" height="30" rx="8" class="chip"/><text x="794" y="226" class="ct">/api/auth</text>
  <rect x="780" y="242" width="190" height="30" rx="8" class="chip"/><text x="794" y="262" class="ct">/api/shared  (public reads)</text>
  <rect x="780" y="278" width="190" height="30" rx="8" class="chip"/><text x="794" y="298" class="ct">/api/shared/account</text>
  <rect x="780" y="314" width="190" height="30" rx="8" class="chip"/><text x="794" y="334" class="ct">/api/admin</text>
  <text x="780" y="374" class="s">Sanctum tokens</text>
  <text x="780" y="394" class="s">Spatie roles &amp; permissions</text>
  <text x="780" y="414" class="s">Translatable fields (ar / en)</text>
  <text x="780" y="434" class="s">Notification log · activity log</text>
  <text x="780" y="454" class="s">CSV exports</text>

  <!-- Column 4: data -->
  <rect x="1030" y="160" width="140" height="92" rx="16" fill="#16303A"/>
  <text x="1048" y="194" font-size="15" font-weight="700" fill="#F3EFE9">MySQL</text>
  <text x="1048" y="216" font-size="12" fill="#B9D2DA">Properties, deals,</text>
  <text x="1048" y="233" font-size="12" fill="#B9D2DA">payments, logs</text>
  <rect x="1030" y="282" width="140" height="78" rx="16" fill="#FFFFFF" stroke="#E2DDD4"/>
  <text x="1048" y="314" class="t">Public storage</text>
  <text x="1048" y="335" class="s">Photos · sliders</text>

  <!-- External -->
  <rect x="760" y="560" width="410" height="104" rx="18" fill="#FFFFFF" stroke="#E2DDD4" stroke-dasharray="5 5"/>
  <text x="780" y="590" class="l">EXTERNAL SERVICES (BROWSER)</text>
  <text x="780" y="616" class="s">OpenStreetMap tiles + Nominatim search (map picker)</text>
  <text x="780" y="638" class="s">Google Maps embed (property page)</text>

  <!-- Flows -->
  <path class="flow" d="M210 286 H254" marker-end="url(#arrow)"/>
  <text x="214" y="278" class="ft">HTTPS</text>
  <path class="flow" d="M690 290 H754" marker-end="url(#arrow)"/>
  <text x="696" y="282" class="ft">REST · JSON</text>
  <path class="flow" d="M754 316 H690" marker-end="url(#arrow)"/>
  <path class="flow" d="M990 206 H1024" marker-end="url(#arrow)"/>
  <path class="flow" d="M990 320 H1024" marker-end="url(#arrow)"/>
  <path class="flow" d="M690 612 H754" marker-end="url(#arrow)" stroke-dasharray="4 4"/>

  <text x="40" y="720" class="s">Highlighted: the part Ibrahim built (all frontend screens, routing, i18n, state and integration with the API contract).</text>
</svg>
